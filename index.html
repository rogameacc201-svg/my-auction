<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>👑 輕鬆玩天堂-專業拍賣系統</title>
    
    <!-- Firebase 核心 SDK (不可刪除) -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root { 
            --gold: #ffcc00; 
            --bg-overlay: rgba(18, 18, 18, 0.85); 
            --card: rgba(30, 30, 30, 0.9); 
            --red: #ff4444; 
            --nav-h: 75px; 
            --green: #00ff88; 
            --blue: #0088ff; 
        }
        * { box-sizing: border-box; }
        
        body { 
            margin: 0; padding: 0; overflow-x: hidden;
            color: white; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-image: url('bg.png'); 
            background-size: cover; background-position: center; background-attachment: fixed; background-color: #000;
            font-size: 17px; 
        }
        body::before { content: ""; position: fixed; inset: 0; background: var(--bg-overlay); z-index: -1; }

        /* 手機跳轉提示 */
        #browser-guide {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center;
        }
        .guide-arrow { position: absolute; top: 10px; right: 20px; font-size: 50px; color: var(--gold); animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* 隱藏式側邊選單 */
        .side-nav-container {
            position: fixed; right: -65px; top: 50%; transform: translateY(-50%);
            z-index: 3000; display: flex; align-items: center;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .side-nav-container:hover { right: 0; }
        .side-nav-handle {
            background: var(--gold); color: black; padding: 15px 5px; font-weight: bold;
            font-size: 14px; writing-mode: vertical-rl; text-orientation: upright;
            border-radius: 10px 0 0 10px; cursor: pointer;
        }
        .side-nav-content {
            display: flex; flex-direction: column; background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--gold); border-right: none; border-radius: 0 0 0 12px;
        }
        .side-nav-item {
            color: var(--gold); text-decoration: none; padding: 20px 15px; font-weight: bold;
            font-size: 18px; writing-mode: vertical-rl; text-orientation: upright;
        }

        /* 歷史成交 (字體大2號) */
        #history-list { font-size: 19px; }
        .history-item { margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }

        /* 介面佈局 */
        header { height: var(--nav-h); background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--gold); display: flex; flex-direction: column; align-items: center; justify-content: center; position: sticky; top: 0; z-index: 1500; }
        #main-app { display: none; flex-wrap: wrap; padding: 15px; gap: 15px; justify-content: center; }
        .panel { background: var(--card); border-radius: 12px; border: 1px solid #444; display: flex; flex-direction: column; }
        .auction-card { background: var(--card); padding: 25px; border-radius: 20px; text-align: center; border: 1px solid var(--gold); max-width: 450px; width: 100%; }
        .timer { font-size: 47px; color: var(--red); font-family: monospace; background: #000; margin: 15px 0; padding: 10px; border-radius: 10px; }
        
        /* 登入畫面 */
        #login-screen { position: fixed; inset: 0; background: #121212; z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .btn { padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-gold { background: var(--gold); color: black; }
    </style>
</head>
<body>

    <!-- 手機跳轉提示 -->
    <div id="browser-guide">
        <div class="guide-arrow">↗</div>
        <div class="guide-box" style="background:#1a1a1a; padding:30px; border-radius:20px; border:2px solid var(--gold);">
            <h2 style="color:var(--gold);">請使用外部瀏覽器開啟</h2>
            <p>請點擊右上方 <b style="color:var(--red);">「...」</b></p>
            <p>選擇 <b style="color:var(--green);">「使用瀏覽器開啟」</b> 以確保功能正常運作</p>
            <button class="btn btn-gold" onclick="document.getElementById('browser-guide').style.display='none'">繼續瀏覽</button>
        </div>
    </div>

    <!-- 隱藏式側邊選單 -->
    <div class="side-nav-container">
        <div class="side-nav-handle">◀ 快速選單</div>
        <nav class="side-nav-content">
            <a href="https://rogameacc201-svg.github.io/my-auction/" target="_blank" class="side-nav-item" style="border-bottom:1px solid #444;">拍賣場</a>
            <a href="https://rogameacc201-svg.github.io/-/" target="_blank" class="side-nav-item">討論區</a>
        </nav>
    </div>

    <header>
        <h1 id="header-title">👑 輕鬆玩天堂-專業拍賣系統</h1>
        <div id="top-broadcast" style="color:var(--red); font-weight:bold;">連線中...</div>
    </header>

    <!-- 登入介面 -->
    <div id="login-screen">
        <h1 style="color:var(--gold); margin-bottom:30px;">👑 輕鬆玩天堂-專業拍賣系統</h1>
        <div style="width:100%; max-width:300px; display:flex; flex-direction:column; gap:10px;">
            <button class="btn" style="background:white;" onclick="loginWithGoogle()">Google 登入</button>
            <input type="text" id="guest-name-input" placeholder="遊客暱稱..." style="padding:12px; border-radius:8px; border:none;">
            <button class="btn" style="background:#444; color:white;" onclick="enterAsGuest()">遊客進入</button>
        </div>
    </div>

    <!-- 主程式介面 -->
    <div id="main-app">
        <div class="auction-card">
            <h2 id="disp-item-name" style="color:var(--gold); margin:0;">等待開標...</h2>
            <div class="timer" id="disp-timer">00:00</div>
            <div style="font-size:34px; color:var(--green); font-weight:bold;">$ <span id="disp-price">0</span> <span id="disp-unit">金幣</span></div>
            <div id="disp-min-bid" style="margin:10px 0; color:#ccc;">-</div>
            <button id="btn-quick-bid" class="btn btn-gold" style="width:100%; font-size:20px;" onclick="quickBid()">一鍵出價</button>
        </div>

        <div class="panel" style="width:100%; max-width:320px; height:500px;">
            <div style="padding:10px; background:rgba(0,0,0,0.5); color:var(--green); font-weight:bold; border-bottom:1px solid #444;">📜 歷史成交</div>
            <div id="history-list" style="flex:1; overflow-y:auto; padding:15px;"></div>
        </div>
    </div>

<script>
    // --- 這裡填入你的 Firebase 資訊 ---
    const firebaseConfig = {
  apiKey: "AIzaSyA19M2lU6BCbxtlSOOcYm1Z_tWrsfo2T4s",
  authDomain: "game-ffb82.firebaseapp.com",
  databaseURL: "https://game-ffb82-default-rtdb.firebaseio.com",
  projectId: "game-ffb82",
  storageBucket: "game-ffb82.firebasestorage.app",
  messagingSenderId: "458888690175",
  appId: "1:458888690175:web:c5060beca640700a574fca",
  measurementId: "G-VJ086JK4QN"
};
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    
    let userData = { name: "遊客", uid: null };
    let serverTimeOffset = 0;

    // 瀏覽器偵測
    function checkBrowser() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        if (ua.indexOf("Line") > -1 || ua.indexOf("FBAN") > -1 || ua.indexOf("FBAV") > -1) {
            document.getElementById('browser-guide').style.display = 'flex';
        }
    }
    window.onload = checkBrowser;

    // 登入邏輯
    function loginWithGoogle() {
        auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(res => {
            userData = { name: res.user.displayName, uid: res.user.uid };
            enterApp();
        });
    }

    function enterAsGuest() {
        const name = document.getElementById('guest-name-input').value.trim();
        if(!name) return alert("請輸入暱稱");
        userData = { name: "(遊客) " + name, uid: 'guest_' + Date.now() };
        enterApp();
    }

    function enterApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        startSyncing();
    }

    // 核心數據同步
    function startSyncing() {
        db.ref(".info/serverTimeOffset").on("value", snap => { serverTimeOffset = snap.val() || 0; });

        // 同步拍賣狀態
        db.ref('current_auction').on('value', snap => {
            const data = snap.val(); if(!data) return;
            document.getElementById('disp-item-name').innerText = data.itemName;
            document.getElementById('disp-price').innerText = data.price.toLocaleString();
            const next = data.price + (data.minIncrement || 0);
            document.getElementById('btn-quick-bid').innerText = `一鍵出價 $${next.toLocaleString()}`;
        });

        // 同步歷史成交 (字體大2號)
        db.ref('auction_history').on('value', snap => {
            const box = document.getElementById('history-list'); box.innerHTML = "";
            snap.forEach(child => {
                const h = child.val();
                box.innerHTML = `<div class="history-item">
                    🏆 <b style="color:var(--gold)">${h.itemName}</b><br>
                    <span style="color:#ddd;">得標者: ${h.winner}</span><br>
                    <span style="color:var(--green)">$${h.price.toLocaleString()} ${h.unit}</span>
                </div>` + box.innerHTML;
            });
        });
    }

    function quickBid() {
        db.ref('current_auction').once('value', snap => {
            const d = snap.val();
            const amt = d.price + (d.minIncrement || 0);
            db.ref('current_auction').update({ price: amt, highestBidder: userData.name });
            db.ref('messages').push({ name: "🔨 競標", text: `${userData.name} 出價 $${amt}`, role: 'system' });
        });
    }
</script>
</body>
</html>
