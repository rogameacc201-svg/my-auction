<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>👑 輕鬆玩天堂-專業拍賣系統</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root { 
            --gold: #ffcc00; 
            --bg-overlay: rgba(18, 18, 18, 0.9); 
            --card: rgba(30, 30, 30, 0.95); 
            --red: #ff4444; 
            --green: #00ff88; 
        }
        
        * { box-sizing: border-box; }
        
        body { 
            margin: 0; padding: 0; overflow-x: hidden;
            color: white; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            /* --- 修正：背景圖請替換成你的連結 --- */
            background-image: url('https://w.wallhaven.cc/full/8o/wallhaven-8o999y.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            background-color: #000;
        }

        /* 深色遮罩，確保文字清晰 */
        body::before { 
            content: ""; position: fixed; inset: 0; 
            background: var(--bg-overlay); z-index: -1; 
        }

        /* 手機跳轉提示 */
        #browser-guide {
            position: fixed; inset: 0; background: rgba(0,0,0,0.98);
            z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center;
        }

        /* 隱藏式側邊選單 */
        .side-nav-container {
            position: fixed; right: -65px; top: 50%; transform: translateY(-50%);
            z-index: 3000; display: flex; align-items: center;
            transition: right 0.4s ease;
        }
        .side-nav-container:hover { right: 0; }
        .side-nav-handle {
            background: var(--gold); color: black; padding: 15px 5px; font-weight: bold;
            writing-mode: vertical-rl; border-radius: 10px 0 0 10px; cursor: pointer;
        }
        .side-nav-content {
            display: flex; flex-direction: column; background: #000;
            border: 2px solid var(--gold); border-right: none; border-radius: 0 0 0 12px;
        }
        .side-nav-item {
            color: var(--gold); text-decoration: none; padding: 20px 15px; font-weight: bold;
            writing-mode: vertical-rl; border-bottom: 1px solid #333;
        }

        /* 介面樣式 */
        header { 
            background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--gold); 
            text-align: center; padding: 15px; position: sticky; top: 0; z-index: 1000;
        }
        .auction-card { 
            background: var(--card); padding: 25px; border-radius: 20px; 
            border: 1px solid var(--gold); margin: 20px auto; max-width: 450px; text-align: center;
        }
        .timer { font-size: 45px; color: var(--red); margin: 15px 0; font-family: monospace; }
        
        /* 歷史成交 (字體放大) */
        .history-panel { 
            background: var(--card); border: 1px solid #444; border-radius: 12px;
            width: 90%; max-width: 400px; margin: 20px auto; height: 400px; overflow-y: auto;
        }
        .history-item { font-size: 19px; padding: 10px; border-bottom: 1px solid #333; }

        /* 登入畫面圖示 */
        .login-logo {
            width: 120px; height: 120px; border-radius: 20px; border: 2px solid var(--gold);
            margin-bottom: 20px;
            /* --- 修正：首頁圖請替換成你的連結 --- */
            background-image: url('https://img.icons8.com/color/512/castle.png');
            background-size: cover;
        }

        #login-screen { position: fixed; inset: 0; background: #121212; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn { padding: 12px 25px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-gold { background: var(--gold); color: black; }
    </style>
</head>
<body>

    <!-- 手機提示 -->
    <div id="browser-guide">
        <div style="color:var(--gold); font-size: 60px; margin-bottom: 20px;">↗</div>
        <div style="background:#222; padding:30px; border-radius:20px; border:1px solid var(--gold); text-align:center;">
            <p>請點選右上角 <b style="color:var(--red);">「...」</b></p>
            <p>選擇 <b style="color:var(--green);">「使用瀏覽器開啟」</b></p>
            <button class="btn btn-gold" onclick="document.getElementById('browser-guide').style.display='none'">繼續瀏覽</button>
        </div>
    </div>

    <!-- 側邊選單 -->
    <div class="side-nav-container">
        <div class="side-nav-handle">◀ 快速跳轉</div>
        <nav class="side-nav-content">
            <a href="https://rogameacc201-svg.github.io/my-auction/" target="_blank" class="side-nav-item">拍賣場</a>
            <a href="https://rogameacc201-svg.github.io/-/" target="_blank" class="side-nav-item">討論區</a>
        </nav>
    </div>

    <header>
        <h1 style="color:var(--gold); margin:0;">👑 輕鬆玩天堂-專業拍賣系統</h1>
        <div id="top-status" style="color:var(--red);">伺服器連線中...</div>
    </header>

    <div id="login-screen">
        <div class="login-logo"></div>
        <h2 style="color:var(--gold); margin-bottom:20px;">👑 輕鬆玩天堂-專業拍賣系統</h2>
        <div style="display:flex; flex-direction:column; gap:10px; width:280px;">
            <button class="btn" style="background:#fff;" onclick="loginWithGoogle()">Google 登入</button>
            <input type="text" id="guest-name" placeholder="輸入暱稱..." style="padding:12px; border-radius:8px; border:none;">
            <button class="btn" style="background:#444; color:white;" onclick="enterAsGuest()">遊客進入</button>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <div class="auction-card">
            <h2 id="item-name" style="color:var(--gold);">等待開標...</h2>
            <div class="timer" id="timer-val">00:00</div>
            <div style="font-size:32px; color:var(--green); font-weight:bold;">$ <span id="price-val">0</span></div>
            <button class="btn btn-gold" style="width:100%; font-size:20px; margin-top:20px;" onclick="bidNow()">立即出價</button>
        </div>

        <div class="history-panel">
            <div style="padding:10px; background:rgba(0,0,0,0.5); border-bottom:1px solid #444; color:var(--gold);">📜 歷史成交記錄</div>
            <div id="history-list"></div>
        </div>
    </div>

<script>
    // --- Firebase 設定 ---
    const firebaseConfig = {
  apiKey: "AIzaSyA19M2lU6BCbxtlSOOcYm1Z_tWrsfo2T4s",
  authDomain: "game-ffb82.firebaseapp.com",
  databaseURL: "https://game-ffb82-default-rtdb.firebaseio.com",
  projectId: "game-ffb82",
  storageBucket: "game-ffb82.firebasestorage.app",
  messagingSenderId: "458888690175",
  appId: "1:458888690175:web:c5060beca640700a574fca",
  measurementId: "G-VJ086JK4QN"
};
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let myName = "";

    // 瀏覽器檢查
    window.onload = function() {
        const ua = navigator.userAgent;
        if (ua.includes("Line") || ua.includes("FBAN") || ua.includes("FBAV")) {
            document.getElementById('browser-guide').style.display = 'flex';
        }
    };

    function loginWithGoogle() {
        firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(res => {
            myName = res.user.displayName;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            startLive();
        });
    }

    function enterAsGuest() {
        myName = document.getElementById('guest-name').value || "無名英雄";
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        startLive();
    }

    function startLive() {
        db.ref('current_auction').on('value', snap => {
            const d = snap.val();
            if(d) {
                document.getElementById('item-name').innerText = d.itemName;
                document.getElementById('price-val').innerText = d.price.toLocaleString();
                document.getElementById('top-status').innerText = "📢 拍賣進行中";
            }
        });

        db.ref('auction_history').on('value', snap => {
            const list = document.getElementById('history-list');
            list.innerHTML = "";
            snap.forEach(c => {
                const h = c.val();
                list.innerHTML = `<div class="history-item">🏆 <b>${h.itemName}</b> - ${h.winner} ($${h.price.toLocaleString()})</div>` + list.innerHTML;
            });
        });
    }

    function bidNow() {
        db.ref('current_auction').once('value', snap => {
            const d = snap.val();
            db.ref('current_auction').update({ 
                price: d.price + d.minIncrement, 
                highestBidder: myName 
            });
        });
    }
</script>
</body>
</html>
